<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda - Fernando & Edgar</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background-color: #faf6f0;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            margin: 20px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #f0e6dc;
        }
        .couple-names {
            font-size: 2.2rem;
            color: #2c3e50;
            margin: 15px 0 5px 0;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #8c7b70;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .photo-container {
            width: 100%;
            height: 320px;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
            background-color: #f7f2ed;
            border: 2px dashed #dcd0c0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .date-box {
            background-color: #fdfbf7;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #f0e6dc;
        }
        .date-box p {
            margin: 5px 0;
            font-size: 1.05rem;
            color: #555;
        }
        .message {
            font-style: italic;
            color: #666;
            line-height: 1.6;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #2c3e50;
            color: #ffffff;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 30px;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background 0.3s ease;
            font-family: sans-serif;
            font-size: 0.95rem;
        }
        .btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="subtitle">¡Nos Casamos!</div>
        <h1 class="couple-names">Mistica & Elvis</h1>
        
        <!-- Cambia esta liga por la de tu foto específica -->
        <div class="photo-container">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="Fernando y Edgar">
        </div>

        <div class="date-box">
            <p><strong>📅 Fecha:</strong> Viernes, 18 de Diciembre de 2026</p>
            <p><strong>📍 Lugar:</strong> Salón Caná</p>
        </div>

        <p class="message">
            "Hay momentos en la vida que son inolvidables, compartirlos con quienes más amamos los hace eternos. ¡Gracias por acompañarnos!"
        </p>
        
        <a href="https://wa.me/525951164145?text=¡Hola!%20Confirmo%20mi%20asistencia%20a%20su%20boda." class="btn">Confirmar Asistencia</a>
    </div>

</body>
</html>
